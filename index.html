<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Trap Beats (No Vocals)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='20'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
body{font-family:system-ui,sans-serif;background:#0e0e10;color:#eee;margin:0}
header{position:sticky;top:0;background:#0e0e10;padding:10px;display:flex;gap:8px;
flex-wrap:wrap;align-items:center;border-bottom:1px solid #222;z-index:2}
input{flex:1;min-width:180px;padding:8px;background:#1a1a1e;color:#eee;
border:1px solid #333;border-radius:6px}
button{padding:8px 12px;background:#1a1a1e;color:#eee;border:1px solid #333;
border-radius:6px;cursor:pointer}button:hover{background:#26262c}
audio{width:100%;padding:8px 10px;box-sizing:border-box}
#info{padding:2px 12px 8px;color:#89a;font-size:13px;word-break:break-word}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:8px;padding:12px}
.c{background:#17171b;border:1px solid #26262c;border-radius:8px;padding:10px;
cursor:pointer;overflow:hidden}.c:hover{border-color:#556}.c.now{border-color:#4a8cff}
.c b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .id{color:#889;font-size:12px}
.c .dl{float:right;color:#678;font-size:14px;padding:0 4px}
.c .dl:hover{color:#fff}
#pgbar{text-align:center;color:#889;padding:8px 0 30px}
#st{color:#889;font-size:12px}
</style></head><body>
<header><input id="q" type="search" placeholder="Search loaded tracks...">
<button id="pgp" title="Previous page">&#9664; pg</button>
<button id="pgn" title="Next page">pg &#9654;</button>
<button id="prev" title="Previous song">&#9198; Prev</button>
<button id="skip" title="Next song">&#9197; Next</button>
<button id="rnd" title="Shuffle mode">&#128256; Random</button>
<button id="mode" title="Toggle continuation mode">&#9654; Order</button>
<button id="auto" title="Autoplay continuation on/off">Auto &#10003;</button>
<button id="dl" title="Download current song as MP3">&#11015; MP3</button>
<button id="more">+10 chunks</button><span id="st"></span></header>
<audio id="au" controls preload="none"></audio>
<div id="info">Click a track - playback continues automatically.</div>
<div id="list"></div><div id="pgbar"></div>
<script>
const PROXY = ""; // if Chrome fails playback (CORS): "https://corsproxy.io/?url="
let M, T = [], F = [], p = 0, hls = null;
let mode = "order", auto = true, curT = null;
let history = [], hIdx = -1;
let fails = 0, lastSkip = 0, dlBusy = false;
const PER = 60;
const au = document.getElementById('au');
const $ = id => document.getElementById(id);
const st = t => $('st').textContent = t;
const seen = new Set();

// ---------- chunk loading (race-proof) ----------
function chunk(i){
  if (i < 0 || i >= M.chunks.length) return Promise.resolve(false);
  if (M.loaded[i]) return M.loaded[i];
  M.loaded[i] = (async () => {
    try {
      const r = await fetch('data/' + M.chunks[i]);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      for (const t of d) if (!seen.has(t.i)){ seen.add(t.i); T.push(t); }
      st(T.length.toLocaleString() + ' / ' + M.total.toLocaleString() + ' loaded');
      return true;
    } catch (e) { M.loaded[i] = 0; return false; }
  })();
  return M.loaded[i];
}
async function more(n){
  let k = 0;
  for (let i = 0; i < M.chunks.length && k < n; i++)
    if (!M.loaded[i]) { if (await chunk(i)) k++; }
}

// ---------- list / filter ----------
function applyFilter(){
  const q = $('q').value.trim().toLowerCase();
  F = q ? T.filter(t => t.t.toLowerCase().includes(q)) : T;
}
function flt(){ applyFilter(); p = 0; draw(); }
function draw(){
  const el = $('list'); el.innerHTML = '';
  const s = p * PER;
  for (const t of F.slice(s, s + PER)){
    const d = document.createElement('div'); d.className = 'c'; d.dataset.i = t.i;
    const dl = document.createElement('span'); dl.className = 'dl';
    dl.textContent = '\u2b07'; dl.title = 'Download as MP3';
    dl.onclick = ev => { ev.stopPropagation(); downloadTrack(t); };
    const b = document.createElement('b'); b.textContent = t.t;
    const it = document.createElement('span'); it.className = 'id'; it.textContent = t.i;
    d.append(dl, b, it);
    d.onclick = () => { setMode('order'); play(t, d); };
    el.appendChild(d);
  }
  $('pgbar').textContent = F.length
    ? (s+1) + '-' + Math.min(s+PER, F.length) + ' of '
      + F.length.toLocaleString() + ' loaded (page ' + (p+1) + ')'
    : 'no matches';
}

// ---------- playback ----------
function setMode(m){
  mode = m;
  $('mode').innerHTML = m === 'order' ? '&#9654; Order' : '&#128256; Random';
}
function play(t, card, fromHistory){
  curT = t;
  if (!fromHistory){
    history = history.slice(0, hIdx + 1);
    history.push(t); hIdx = history.length - 1;
    if (history.length > 500){ history.shift(); hIdx--; }
  }
  document.querySelectorAll('.c.now').forEach(c => c.classList.remove('now'));
  const sel = '.c[data-i="' + CSS.escape(String(t.i)) + '"]';
  const el = card || document.querySelector(sel);
  if (el){ el.classList.add('now'); el.scrollIntoView({block:'nearest'}); }
  $('info').textContent = '\u25B6 ' + t.t;
  const u = PROXY ? PROXY + encodeURIComponent(t.u) : t.u;
  if (au.canPlayType('application/vnd.apple.mpegurl')){
    au.src = u; au.play().catch(()=>{});
  } else if (window.Hls && Hls.isSupported()){
    if (hls) hls.destroy();
    hls = new Hls({maxBufferLength: 30});
    hls.loadSource(u); hls.attachMedia(au);
    hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) skipFail(); });
    au.play().catch(()=>{});
  } else $('info').textContent = 'No HLS support in this browser.';
}
function gotoInList(t){
  const idx = F.indexOf(t);
  if (idx >= 0){ p = Math.floor(idx / PER); draw(); }
}
async function nextTrack(dir = 1){
  if (!F.length){
    if ($('q').value) $('q').value = '';
    applyFilter();
    if (!F.length) return;
  }
  if (mode === 'random'){
    let t;
    do { t = F[Math.floor(Math.random() * F.length)]; }
    while (F.length > 1 && t === curT);
    play(t); return;
  }
  let idx = curT ? F.indexOf(curT) : -1;
  if (idx === -1) idx = Math.min(p * PER, F.length - 1);
  let target = idx + dir;
  if (target >= F.length){
    const i = M.chunks.findIndex((_, j) => !M.loaded[j]);
    if (i >= 0){
      await chunk(i);
      applyFilter();
      idx = curT ? F.indexOf(curT) : -1;
      target = idx === -1 ? 0 : idx + dir;
    }
    if (target >= F.length) target = 0;
  }
  if (target < 0) target = F.length - 1;
  p = Math.floor(target / PER); draw();
  play(F[target]);
}
function prevTrack(){
  if (hIdx > 0){
    hIdx--;
    const t = history[hIdx];
    gotoInList(t);
    play(t, null, true);
    return;
  }
  if (mode === 'order' && F.length){
    let idx = curT ? F.indexOf(curT) : 0;
    let target = idx <= 0 ? F.length - 1 : idx - 1;
    p = Math.floor(target / PER); draw();
    play(F[target]);
    return;
  }
  $('info').textContent = 'No previous track yet.';
}
function skipFail(){
  if (Date.now() - lastSkip < 500) return;
  lastSkip = Date.now();
  fails++;
  if (!auto || fails > 5){
    $('info').textContent = fails > 5
      ? 'Stopped: 5 consecutive playback failures.'
      : 'Playback failed (CORS or dead link).';
    return;
  }
  setTimeout(() => nextTrack(1), 700);
}
au.addEventListener('ended', () => { if (auto) nextTrack(1); });
au.addEventListener('error', () => skipFail());
au.addEventListener('playing', () => { fails = 0; });

// ---------- ffmpeg.wasm encoder ----------
// FIX: single-threaded core (@ffmpeg/core-st) + mainName:'main'.
// The multi-threaded core (@ffmpeg/core) needs SharedArrayBuffer +
// COOP/COEP headers, which GitHub Pages cannot send.
const FF_SOURCES = [
  { label: "self-hosted",
    lib:  new URL("ff/ffmpeg.min.js", location.href).href,
    core: new URL("ff/ffmpeg-core.js", location.href).href },
  { label: "jsdelivr CDN",
    lib:  "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js",
    core: "https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js" },
  { label: "unpkg CDN",
    lib:  "https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js",
    core: "https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js" },
];
let ffInst = null, ffErr = null;

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('script failed: ' + src));
    document.head.appendChild(s);
  });
}
function withTimeout(p, ms, msg){
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))
  ]);
}
async function getFFmpeg(t){
  if (ffInst) return ffInst;
  for (const src of FF_SOURCES){
    const t0 = Date.now();
    try {
      $('info').textContent = 'Loading MP3 encoder (' + src.label
        + ', first time ~25 MB)...';
      if (!window.FFmpeg || typeof window.FFmpeg.createFFmpeg !== 'function')
        await loadScript(src.lib);
      if (!window.FFmpeg || typeof window.FFmpeg.createFFmpeg !== 'function')
        throw new Error('FFmpeg library loaded but createFFmpeg is missing');
      const ff = window.FFmpeg.createFFmpeg({
        log: false,
        corePath: src.core,
        mainName: 'main',          // required by the single-threaded core
        progress: ({ratio}) => {
          if (t && isFinite(ratio) && ratio > 0)
            $('info').textContent = 'Encoding MP3... '
              + Math.min(100, Math.round(ratio * 100)) + '%';
        }
      });
      await withTimeout(ff.load(), 180000,
                        'encoder load timed out (3 min) - network too slow?');
      ffInst = ff;
      console.log('MP3 encoder ready from ' + src.label + ' in '
        + ((Date.now() - t0) / 1000).toFixed(1) + 's');
      return ff;
    } catch (e) {
      ffErr = e;
      console.error('encoder source failed (' + src.label + '):', e);
    }
  }
  const msg = ffErr && ffErr.message ? ffErr.message : 'unknown error';
  $('info').textContent = 'MP3 encoder failed (' + msg.slice(0, 90)
    + '). Saving .ts instead. Press F12 > Console for details.';
  return null;
}
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---------- download (fetch HLS -> ffmpeg -> .mp3) ----------
async function fetchBuf(u){
  const r = await fetch(u);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return new Uint8Array(await r.arrayBuffer());
}
async function downloadTrack(t){
  if (dlBusy){ $('info').textContent = 'A download is already running.'; return; }
  dlBusy = true;
  const safe = s => (s || 'track').replace(/[<>:"/\\|?*\x00-\x1f]/g, '_')
                    .replace(/\s+/g, ' ').trim().slice(0, 100) || 'track';
  const P = u => PROXY ? PROXY + encodeURIComponent(u) : u;
  try {
    let url = t.u;
    let lines = (await (await fetch(P(url))).text())
                .split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.some(l => l.startsWith('#EXT-X-STREAM-INF'))){
      const k = lines.findIndex(l => l.startsWith('#EXT-X-STREAM-INF'));
      url = new URL(lines[k + 1], url).href;
      lines = (await (await fetch(P(url))).text())
              .split('\n').map(s => s.trim()).filter(Boolean);
    }
    if (lines.some(l => l.startsWith('#EXT-X-KEY'))){
      $('info').textContent = 'Stream is encrypted - cannot download.';
      return;
    }
    let mapBytes = null;
    const mapLine = lines.find(l => l.startsWith('#EXT-X-MAP'));
    if (mapLine){
      const mu = (mapLine.match(/URI="([^"]+)"/) || [])[1];
      if (mu) mapBytes = await fetchBuf(P(new URL(mu, url).href));
    }
    const segs = lines.filter(l => !l.startsWith('#'))
                      .map(l => new URL(l, url).href);
    if (!segs.length){ $('info').textContent = 'No segments found.'; return; }
    const parts = new Array(segs.length);
    let done = 0, next = 0;
    async function worker(){
      while (next < segs.length){
        const i = next++;
        for (let a = 0; a < 3; a++){
          try { parts[i] = await fetchBuf(P(segs[i])); break; }
          catch (e){ if (a === 2) parts[i] = new Uint8Array(0); }
        }
        done++;
        $('info').textContent = 'Fetching "' + t.t + '" - '
          + done + '/' + segs.length + ' segments...';
      }
    }
    await Promise.all(Array.from({length: 6}, worker));
    const raw = new Blob(mapBytes ? [mapBytes, ...parts] : parts,
                         {type: 'video/mp2t'});
    const base = safe(t.t) + ' [' + t.i + ']';

    const ff = await getFFmpeg(t);
    if (ff){
      const inName = mapBytes ? 'in.mp4' : 'in.ts';
      try {
        ff.FS('writeFile', inName, new Uint8Array(await raw.arrayBuffer()));
        await ff.run('-i', inName,
                     '-vn', '-c:a', 'libmp3lame', '-b:a', '192k',
                     '-id3v2_version', '3',
                     '-metadata', 'title=' + t.t,
                     'out.mp3');
        const out = ff.FS('readFile', 'out.mp3');
        try { ff.FS('unlink', inName); ff.FS('unlink', 'out.mp3'); } catch (e) {}
        saveBlob(new Blob([out.buffer], {type: 'audio/mpeg'}), base + '.mp3');
        $('info').textContent = 'Saved ' + base + '.mp3 ('
          + (out.length / 1048576).toFixed(1) + ' MB)';
        return;
      } catch (e) {
        console.error('mp3 encode failed:', e);
        $('info').textContent = 'MP3 encoding failed ('
          + String(e.message || e).slice(0, 60) + ') - saving raw .ts instead.';
      }
    }
    saveBlob(raw, base + '.ts');
  } catch (e) {
    $('info').textContent = 'Download failed: ' + e.message
      + (PROXY ? '' : ' (CORS? set PROXY at top of script)');
  } finally { dlBusy = false; }
}

// ---------- wiring ----------
 $('pgp').onclick = () => { if (p > 0){ p--; draw(); } };
 $('pgn').onclick = () => { if ((p+1)*PER < F.length){ p++; draw(); } };
 $('prev').onclick = prevTrack;
 $('skip').onclick = () => nextTrack(1);
 $('rnd').onclick  = () => { setMode('random'); nextTrack(1); };
 $('mode').onclick = () => setMode(mode === 'order' ? 'random' : 'order');
 $('auto').onclick = () => {
  auto = !auto;
  $('auto').innerHTML = 'Auto ' + (auto ? '&#10003;' : '&#10007;');
};
 $('dl').onclick = () => { if (curT) downloadTrack(curT);
  else $('info').textContent = 'Play a track first.'; };
 $('more').onclick = async () => { await more(10); flt(); };
 $('q').oninput = flt;
setMode('order');
(async () => {
  M = await (await fetch('data/manifest.json')).json();
  M.loaded = {};
  await chunk(0); await chunk(1);
  flt();
})();
</script></body></html>
